import groovy.json.JsonSlurper

import javax.imageio.ImageIO
import java.awt.image.BufferedImage

/*
 * MDTNH 构建期灰度材质烘焙器
 *
 * 设计目标：
 * 1. 只在 Gradle 构建阶段运行，游戏运行时零额外材质混合开销。
 * 2. 灰度模板 RGB 控制亮度，Alpha 独立控制透明度。
 * 3. 支持：
 *      - 灰度模板 + 纯颜色
 *      - 灰度模板 + 材质贴图
 *      - 灰度模板 + 材质贴图 + Tint
 * 4. 支持 stretch / tile 两种材质 UV 映射。
 * 5. 生成文件直接写入 assets/sprites，文件名可与 Mindustry Content name 对齐。
 * 6. 使用 manifest 记录自己生成过的文件，只清理这些文件，不碰手绘 sprite。
 */

def materialBakeConfigFile = file("$projectDir/material-bake.json")

def readMaterialBakeConfig = {
    if (!materialBakeConfigFile.exists()) {
        throw new GradleException(
                "未找到材质烘焙配置：${materialBakeConfigFile}\n" +
                        "请在项目根目录创建 material-bake.json。"
        )
    }

    return new JsonSlurper().parse(materialBakeConfigFile)
}

def clampByte = { double value ->
    return Math.max(0, Math.min(255, Math.round(value) as int))
}

def parseHexColor = { Object raw ->
    if (raw == null) {
        return [255, 255, 255, 255]
    }

    String text = raw.toString().trim()

    if (text.startsWith("#")) {
        text = text.substring(1)
    }

    if (text.length() == 6) {
        text += "FF"
    }

    if (text.length() != 8) {
        throw new GradleException(
                "颜色必须是 #RRGGBB 或 #RRGGBBAA，当前值：${raw}"
        )
    }

    try {
        return [
                Integer.parseInt(text.substring(0, 2), 16),
                Integer.parseInt(text.substring(2, 4), 16),
                Integer.parseInt(text.substring(4, 6), 16),
                Integer.parseInt(text.substring(6, 8), 16)
        ]
    } catch (NumberFormatException ex) {
        throw new GradleException("无效颜色：${raw}", ex)
    }
}

def luminance = { int argb ->
    int r = (argb >>> 16) & 0xFF
    int g = (argb >>> 8) & 0xFF
    int b = argb & 0xFF

    // Rec.601 亮度权重。
    return (
            r * 0.299d +
                    g * 0.587d +
                    b * 0.114d
    ) / 255.0d
}

def sampleMaterial = { BufferedImage image, int x, int y, int targetWidth, int targetHeight, String mapping ->
    if (image == null) {
        // 没有材质贴图时使用纯白材质，后续再乘 tint。
        return 0xFFFFFFFF as int
    }

    int sx
    int sy

    switch (mapping) {
        case "tile":
            sx = Math.floorMod(x, image.width)
            sy = Math.floorMod(y, image.height)
            break

        case "stretch":
            sx = Math.min(
                    image.width - 1,
                    (int) Math.floor((x / (double) targetWidth) * image.width)
            )
            sy = Math.min(
                    image.height - 1,
                    (int) Math.floor((y / (double) targetHeight) * image.height)
            )
            break

        default:
            throw new GradleException(
                    "未知 mapping：${mapping}。目前支持 stretch / tile。"
            )
    }

    return image.getRGB(sx, sy)
}

def bakeOne = {
    BufferedImage grayImage,
    BufferedImage materialImage,
    List<Integer> tint,
    String mode,
    String mapping ->

        int width = grayImage.width
        int height = grayImage.height

        BufferedImage output = new BufferedImage(
                width,
                height,
                BufferedImage.TYPE_INT_ARGB
        )

        for (int y = 0; y < height; y++) {
            for (int x = 0; x < width; x++) {

                int grayArgb = grayImage.getRGB(x, y)

                int grayA = (grayArgb >>> 24) & 0xFF
                double gray = luminance(grayArgb)

                int materialArgb = sampleMaterial(
                        materialImage,
                        x,
                        y,
                        width,
                        height,
                        mapping
                )

                int materialA = (materialArgb >>> 24) & 0xFF
                int materialR = (materialArgb >>> 16) & 0xFF
                int materialG = (materialArgb >>> 8) & 0xFF
                int materialB = materialArgb & 0xFF

                /*
                 * 材质贴图先乘 tint：
                 */
                double tintedR = materialR * (tint[0] / 255.0d)
                double tintedG = materialG * (tint[1] / 255.0d)
                double tintedB = materialB * (tint[2] / 255.0d)
                double tintedA = materialA * (tint[3] / 255.0d)

                int outR
                int outG
                int outB
                int outA

                switch (mode) {
                    case "multiply":
                        outR = clampByte(tintedR * gray)
                        outG = clampByte(tintedG * gray)
                        outB = clampByte(tintedB * gray)
                        outA = clampByte(grayA * (tintedA / 255.0d))
                        break

                    case "mask":
                        outR = clampByte(tintedR)
                        outG = clampByte(tintedG)
                        outB = clampByte(tintedB)
                        outA = clampByte(
                                grayA *
                                        gray *
                                        (tintedA / 255.0d)
                        )
                        break

                    default:
                        throw new GradleException(
                                "未知 mode：${mode}。目前支持 multiply / mask。"
                        )
                }

                int outArgb =
                        ((outA & 0xFF) << 24) |
                                ((outR & 0xFF) << 16) |
                                ((outG & 0xFF) << 8) |
                                (outB & 0xFF)

                output.setRGB(x, y, outArgb)
            }
        }

        return output
}

tasks.register("bakeMaterialSprites") {
    group = "mdtnh assets"
    description = "根据灰度模板、材质贴图和颜色配置生成静态 PNG。"

    inputs.file(materialBakeConfigFile)

    outputs.upToDateWhen { false }

    doLast {
        def config = readMaterialBakeConfig()

        // ---------- 新增：读取文件策略 ----------
        String existingFilePolicy = (
                config.existingFilePolicy ?: "error"
        ).toString().toLowerCase()

        def validPolicies = [
                "skip",
                "overwrite-generated",
                "overwrite-all",
                "error"
        ]

        if (!validPolicies.contains(existingFilePolicy)) {
            throw new GradleException(
                    "无效 existingFilePolicy: ${existingFilePolicy}\n" +
                            "允许值: ${validPolicies.join(', ')}"
            )
        }

        // ---------------------------------------

        File sourceRoot = file(
                config.sourceRoot ?: "material-source"
        )

        File outputRoot = file(
                config.outputRoot ?: "assets/sprites"
        )

        File manifestFile = file(
                config.manifest ?: "$buildDir/material-baker/generated-files.txt"
        )

        if (!sourceRoot.exists()) {
            throw new GradleException(
                    "材质源目录不存在：${sourceRoot}"
            )
        }

        outputRoot.mkdirs()
        manifestFile.parentFile.mkdirs()

        Set<String> previousGenerated = new LinkedHashSet<>()

        if (manifestFile.exists()) {
            manifestFile.eachLine("UTF-8") { line ->
                String value = line.trim()
                if (!value.isEmpty()) {
                    previousGenerated.add(value)
                }
            }
        }

        Set<String> currentGenerated = new LinkedHashSet<>()
        int generatedCount = 0

        def recipes = config.recipes

        if (!(recipes instanceof List) || recipes.isEmpty()) {
            throw new GradleException(
                    "material-bake.json 中没有 recipes。"
            )
        }

        recipes.each { recipe ->

            String recipeName =
                    (recipe.name ?: "unnamed").toString()

            String mode =
                    (recipe.mode ?: "multiply").toString()

            String mapping =
                    (recipe.mapping ?: "stretch").toString()

            def templates = recipe.templates
            def variants = recipe.variants

            if (!(templates instanceof List) || templates.isEmpty()) {
                throw new GradleException(
                        "Recipe '${recipeName}' 没有 templates。"
                )
            }

            if (!(variants instanceof List) || variants.isEmpty()) {
                throw new GradleException(
                        "Recipe '${recipeName}' 没有 variants。"
                )
            }

            templates.each { templateSpec ->

                String templateId =
                        templateSpec.id.toString()

                File grayFile = new File(
                        sourceRoot,
                        templateSpec.file.toString()
                )

                if (!grayFile.exists()) {
                    throw new GradleException(
                            "缺少灰度模板：${grayFile}"
                    )
                }

                BufferedImage grayImage =
                        ImageIO.read(grayFile)

                if (grayImage == null) {
                    throw new GradleException(
                            "无法读取 PNG：${grayFile}"
                    )
                }

                variants.each { variant ->

                    String variantId =
                            variant.id.toString()

                    String materialPath =
                            variant.containsKey("material")
                                    ? (variant.material ?: "").toString()
                                    : (recipe.material ?: "").toString()

                    BufferedImage materialImage = null

                    if (!materialPath.isEmpty()) {

                        File materialFile =
                                new File(
                                        sourceRoot,
                                        materialPath
                                )

                        if (!materialFile.exists()) {
                            throw new GradleException(
                                    "缺少材质贴图：${materialFile}"
                            )
                        }

                        materialImage =
                                ImageIO.read(materialFile)

                        if (materialImage == null) {
                            throw new GradleException(
                                    "无法读取 PNG：${materialFile}"
                            )
                        }
                    }

                    List<Integer> tint =
                            parseHexColor(
                                    variant.tint ?: "#FFFFFFFF"
                            )

                    String outputPattern =
                            (variant.output
                                    ?: recipe.output
                                    ?: "{variant}-{template}.png")
                                    .toString()

                    String outputName =
                            outputPattern
                                    .replace(
                                            "{variant}",
                                            variantId
                                    )
                                    .replace(
                                            "{template}",
                                            templateId
                                    )

                    if (!outputName.toLowerCase().endsWith(".png")) {
                        outputName += ".png"
                    }

                    File outputFile =
                            new File(
                                    outputRoot,
                                    outputName
                            )

                    String relativeOutput =
                            projectDir.toPath()
                                    .relativize(
                                            outputFile.toPath()
                                    )
                                    .toString()
                                    .replace("\\", "/")

                    // ---------- 新增：文件存在处理 ----------
                    boolean shouldGenerate = true

                    if (outputFile.exists()) {

                        switch (existingFilePolicy) {

                            case "skip":
                                // 如果之前是 Baker 生成的，保留在清单中；否则不添加
                                if (previousGenerated.contains(relativeOutput)) {
                                    currentGenerated.add(relativeOutput)
                                }
                                shouldGenerate = false
                                logger.lifecycle(
                                        "[MaterialBaker] Skip existing: ${relativeOutput}"
                                )
                                break

                            case "overwrite-generated":
                                if (!previousGenerated.contains(relativeOutput)) {
                                    throw new GradleException(
                                            "输出已存在且不是 MaterialBaker 生成的文件：${outputFile}\n" +
                                                    "若要强制覆盖，请将 existingFilePolicy 改为 'overwrite-all' 或 'skip'。"
                                    )
                                }
                                // 允许覆盖，继续生成
                                break

                            case "overwrite-all":
                                // 无条件覆盖
                                logger.lifecycle(
                                        "[MaterialBaker] Overwrite: ${relativeOutput}"
                                )
                                break

                            case "error":
                                throw new GradleException(
                                        "输出已存在：${outputFile}\n" +
                                                "请设置 existingFilePolicy 为 'skip' / 'overwrite-generated' / 'overwrite-all'。"
                                )

                            default:
                                // 不该走到这里，但保留兜底
                                throw new GradleException(
                                        "未知策略：${existingFilePolicy}"
                                )
                        }
                    }

                    // 如果决定跳过，直接进入下一个 variant
                    if (!shouldGenerate) {
                        return // 注意：这里 return 的是 variants.each 闭包，跳过当前 variant
                    }

                    // ---------- 正常烘焙 ----------
                    outputFile.parentFile.mkdirs()

                    BufferedImage baked =
                            bakeOne(
                                    grayImage,
                                    materialImage,
                                    tint,
                                    mode,
                                    mapping
                            )

                    if (!ImageIO.write(
                            baked,
                            "png",
                            outputFile
                    )) {
                        throw new GradleException(
                                "PNG 写入失败：${outputFile}"
                        )
                    }

                    // 只有真正由 Baker 生成的才加入清单
                    currentGenerated.add(relativeOutput)
                    generatedCount++

                    logger.lifecycle(
                            "[MaterialBaker] ${recipeName}: ${relativeOutput}"
                    )
                    // ------------------------------
                }
            }
        }

        // ---------- 清理不再生成的旧文件 ----------
        previousGenerated.each { relativePath ->

            if (currentGenerated.contains(relativePath)) {
                return
            }

            File stale =
                    new File(projectDir, relativePath)

            if (
                    stale.exists() &&
                            stale.toPath()
                                    .normalize()
                                    .startsWith(
                                            outputRoot.toPath()
                                                    .normalize()
                                    )
            ) {
                if (!stale.delete()) {
                    throw new GradleException(
                            "无法删除旧生成文件：${stale}"
                    )
                }

                logger.lifecycle(
                        "[MaterialBaker] removed stale: ${relativePath}"
                )
            }
        }

        manifestFile.setText(
                currentGenerated.join(
                        System.lineSeparator()
                ) +
                        (
                                currentGenerated.isEmpty()
                                        ? ""
                                        : System.lineSeparator()
                        ),
                "UTF-8"
        )

        logger.lifecycle(
                "[MaterialBaker] 完成，共生成 ${generatedCount} 张 PNG。"
        )
    }
}

tasks.register("cleanMaterialSprites") {
    group = "mdtnh assets"
    description = "仅删除 MaterialBaker 自己生成过的 PNG。"

    doLast {
        def config = readMaterialBakeConfig()

        File outputRoot = file(
                config.outputRoot ?: "assets/sprites"
        )

        File manifestFile = file(
                config.manifest ?: "$buildDir/material-baker/generated-files.txt"
        )

        if (!manifestFile.exists()) {
            logger.lifecycle(
                    "[MaterialBaker] 没有 manifest，无需清理。"
            )
            return
        }

        manifestFile.eachLine("UTF-8") { line ->
            String relativePath = line.trim()

            if (relativePath.isEmpty()) {
                return
            }

            File target =
                    new File(projectDir, relativePath)

            if (
                    target.exists() &&
                            target.toPath()
                                    .normalize()
                                    .startsWith(
                                            outputRoot.toPath()
                                                    .normalize()
                                    )
            ) {
                if (!target.delete()) {
                    throw new GradleException(
                            "无法删除：${target}"
                    )
                }

                logger.lifecycle(
                        "[MaterialBaker] removed: ${relativePath}"
                )
            }
        }

        manifestFile.delete()
    }
}

/*
 * 自动挂到常见 Mindustry Java Mod 构建任务。
 */
tasks.matching {
    it.name == "jar" ||
            it.name == "deploy" ||
            it.name == "dex"
}.configureEach {
    dependsOn tasks.named("bakeMaterialSprites")
}