item.mindustry_newhorizon-actinium-ingot.description=锕锭，由锕粉在工业高炉中冶炼后生成的热锕锭在真空冷冻机中经过冷却后制得。锕是一种放射性锕系金属，可用于制造锕系合金及核燃料相关组件。
item.mindustry_newhorizon-aluminum-ingot.description=铝锭，由铝粉在工业高炉中冶炼而得，需要的最低冶炼温度为1,700 K，对应可使用白铜线圈方块或能够承受更高炉温的线圈方块来冶炼。铝是MV时期的核心金属，铝板、铝杆等基础元件主要用于合成MV级机器及核心组件。
item.mindustry_newhorizon-americium-ingot.description=镅锭，由镅粉在工业高炉中冶炼后经真空冷冻机冷却制得。镅是一种人工合成的放射性锕系金属，主要用于制造同位素热电机及核电池。
item.mindustry_newhorizon-antimony-ingot.description=锑锭，由锑粉在工业高炉中冶炼而成。锑是一种类金属元素，主要用于制造铅锑合金、半导体材料及阻燃剂。
item.mindustry_newhorizon-barium-ingot.description=钡锭，电解重晶石得到钡粉后冶炼而成。钡主要用于制造钇钡铜氧合金（YBCO）超导材料。
item.mindustry_newhorizon-berkelium-ingot.description=锫锭，由锫粉在工业高炉中冶炼后经真空冷冻机冷却制得。锫是一种人工合成的放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-beryllium-ingot.description=铍锭，化学式Be。可用压模器直接塑造成各种工具（作为工具时耐久极低，性能极差）。聚变反应堆运行配方需求材料之一（液态），可运行出同位素。
item.mindustry_newhorizon-bismuth-ingot.description=铋锭，由铋粉在工业高炉中冶炼而成。铋是一种低熔点金属，主要用于制造低熔点合金、焊料及医药制品。
item.mindustry_newhorizon-bohrium-ingot.description=𬭛锭，由𬭛粉在工业高炉中冶炼后经真空冷冻机冷却制得。𬭛是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-cesium-ingot.description=铯锭，由稀土经过离心有几率得到铯粉，进一步加工即可得到铯锭。铯是一种活泼的碱金属，主要用于制造铯原子钟及光电管。
item.mindustry_newhorizon-calcium-ingot.description=钙锭，由钙粉在工业高炉中冶炼而成。制成钙粉后可用于生产氢气。
item.mindustry_newhorizon-californium-ingot.description=锎锭，由锎粉在工业高炉中冶炼后经真空冷冻机冷却制得。锎是一种人工合成的放射性锕系金属，可用作强中子源。
item.mindustry_newhorizon-cadmium-ingot.description=镉锭，闪锌矿、黄铜矿、硒矿的副产，也可通过离心稀土获得。一般用于制造镍镉电池和镉铟银合金。
item.mindustry_newhorizon-cerium-ingot.description=铈锭，稀土金属之一，可以通过冶炼或电解氟碳铈矿得到，也可以离心稀土获得。铈可用于制造打火石及抛光粉。
item.mindustry_newhorizon-chromium-ingot.description=铬锭，一种重要的工业原料，用于制造各种合金（主要是不锈钢和坎塔尔合金），也用于制造EV级的机器。铬贯穿整个科技线，需求量很大。
item.mindustry_newhorizon-cobalt-ingot.description=钴锭，主要由辉砷钴矿得到，中后期可由磁选矿物杂质砂得到。主要用途是制作工具。
item.mindustry_newhorizon-copernicium-ingot.description=鿔锭，由鿔粉在工业高炉中冶炼后经真空冷冻机冷却制得。鿔是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-copper-ingot.description=铜锭，由铜粉在熔炉中直接烧炼而成。在合金炉中可与锡锭以3:1混合制成青铜锭（SnCu₃），与锌锭以3:1混合制成黄铜锭（ZnCu₃），与等量镍锭混合制成白铜锭（CuNi）。铜线缆广泛用于合成MV级机器组件。
item.mindustry_newhorizon-curium-ingot.description=锔锭，由锔粉在工业高炉中冶炼后经真空冷冻机冷却制得。锔是一种人工合成的放射性锕系金属，主要用于科学研究及同位素生产。
item.mindustry_newhorizon-darmstadtium-ingot.description=𫟼锭，由𫟼粉在工业高炉中冶炼后经真空冷冻机冷却制得。𫟼是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-dubnium-ingot.description=𬭊锭，由𬭊粉在工业高炉中冶炼后经真空冷冻机冷却制得。𬭊是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-dysprosium-ingot.description=镝锭，由镝粉在工业高炉中冶炼而成。镝是一种稀土金属，具有极高的磁导率，主要用于制造磁致伸缩材料及钕磁铁的添加剂。
item.mindustry_newhorizon-einsteinium-ingot.description=锿锭，由锿粉在工业高炉中冶炼后经真空冷冻机冷却制得。锿是一种人工合成的放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-erbium-ingot.description=铒锭，由铒粉在工业高炉中冶炼而成。铒是一种稀土金属，主要用于制造光纤放大器及激光材料。
item.mindustry_newhorizon-europium-ingot.description=铕锭，由铕粉在工业高炉中冶炼而成。铕是一种稀土金属，主要用于制造红色荧光粉及核反应堆控制材料。
item.mindustry_newhorizon-fermium-ingot.description=镄锭，由镄粉在工业高炉中冶炼后经真空冷冻机冷却制得。镄是一种人工合成的放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-flerovium-ingot.description=𫓧锭，由𫓧粉在工业高炉中冶炼后经真空冷冻机冷却制得。𫓧是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-francium-ingot.description=钫锭，由钫粉在工业高炉中冶炼后经真空冷冻机冷却制得。钫是自然界中最重的碱金属，具有极强的放射性，主要用于科学研究。
item.mindustry_newhorizon-gadolinium-ingot.description=钆锭，由钆粉在工业高炉中冶炼而成。钆是一种稀土金属，具有优异的核性能及磁热效应，可用于核反应堆控制棒及磁制冷材料。
item.mindustry_newhorizon-gallium-ingot.description=镓锭，由镓粉在工业高炉中冶炼而成。镓是一种低熔点金属，主要用于制造半导体材料（如GaAs、GaN）及高温温度计。
item.mindustry_newhorizon-gold-ingot.description=金锭，由金粉在熔炉中烧炼而成。金是一种贵金属，主要用于制造电子元件、导线及高级合金，也可用于制作装饰品。
item.mindustry_newhorizon-hafnium-ingot.description=铪锭，由铪粉在工业高炉中冶炼后经真空冷冻机冷却制得。铪具有良好的中子吸收能力，主要用于核反应堆控制材料及高温合金。
item.mindustry_newhorizon-hassium-ingot.description=𬭶锭，由𬭶粉在工业高炉中冶炼后经真空冷冻机冷却制得。𬭶是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-holmium-ingot.description=钬锭，由钬粉在工业高炉中冶炼而成。钬是一种稀土金属，具有极高的磁矩，主要用于制造磁光材料及激光器。
item.mindustry_newhorizon-indium-ingot.description=铟锭，由铟粉在工业高炉中冶炼而成。铟是一种稀有金属，主要用于制造ITO透明导电薄膜及低熔点合金。
item.mindustry_newhorizon-iridium-ingot.description=铱锭，由铱粉在工业高炉中冶炼后生成的热铱锭在真空冷冻机中经过冷却后制得，需要的最低冶炼温度为2,719 K，对应可使用镍铬合金线圈方块或能够承受更高炉温的线圈方块来冶炼。铱是铂族金属中最耐腐蚀的，主要用于制造坩埚及铱锇合金。
item.mindustry_newhorizon-iron-ingot.description=铁锭，由铁粉在熔炉中烧炼而成。铁是最基础的金属材料，广泛用于制造钢、工具及机器结构件。
item.mindustry_newhorizon-lanthanum-ingot.description=镧锭，由镧粉在工业高炉中冶炼而成。镧是一种稀土金属，主要用于制造镍氢电池的储氢合金及光学玻璃。
item.mindustry_newhorizon-lawrencium-ingot.description=铹锭，由铹粉在工业高炉中冶炼后经真空冷冻机冷却制得。铹是一种人工合成的放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-lead-ingot.description=铅锭，由铅粉在熔炉中烧炼而成。铅是一种低熔点金属，主要用于制造蓄电池、辐射屏蔽材料及焊料。
item.mindustry_newhorizon-lithium-ingot.description=锂锭，由锂粉在工业高炉中冶炼而成。锂是最轻的金属，主要用于制造电池材料（如锂钴氧化物）、铝合金及核聚变燃料。
item.mindustry_newhorizon-livermorium-ingot.description=𫟷锭，由𫟷粉在工业高炉中冶炼后经真空冷冻机冷却制得。𫟷是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-lutetium-ingot.description=镥锭，由镥粉在工业高炉中冶炼而成。镥是最重的稳定稀土金属，主要用于石油裂化催化剂及闪烁晶体。
item.mindustry_newhorizon-magnesium-ingot.description=镁锭，由镁粉在工业高炉中冶炼而成。镁是一种轻金属，由镁粉和铝粉以1:2的比例混合冶炼可制成镁铝合金锭（MgAl₂）。
item.mindustry_newhorizon-mendelevium-ingot.description=钔锭，由钔粉在工业高炉中冶炼后经真空冷冻机冷却制得。钔是一种人工合成的放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-manganese-ingot.description=锰锭，由锰粉在工业高炉中冶炼而成。锰是一种重要的工业金属，主要用于制造锰钢、电池及催化剂。
item.mindustry_newhorizon-meitnerium-ingot.description=鿏锭，由鿏粉在工业高炉中冶炼后经真空冷冻机冷却制得。鿏是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-mercury-ingot.description=汞锭，由汞粉在工业高炉中冶炼后经真空冷冻机冷却制得。汞是常温下唯一的液态金属，主要用于制造温度计、荧光灯及化学催化剂。
item.mindustry_newhorizon-molybdenum-ingot.description=钼锭，由钼粉在工业高炉中冶炼后经真空冷冻机冷却制得。钼是一种难熔金属，主要用于制造高温合金、高速钢及催化剂。
item.mindustry_newhorizon-moscovium-ingot.description=镆锭，由镆粉在工业高炉中冶炼后经真空冷冻机冷却制得。镆是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-neodymium-ingot.description=钕锭，由钕粉在工业高炉中冶炼而成。钕是一种稀土金属，主要用于制造强力钕磁铁（Nd₂Fe₁₄B）及激光材料。
item.mindustry_newhorizon-neptunium-ingot.description=镎锭，由镎粉在工业高炉中冶炼后经真空冷冻机冷却制得。镎是一种人工合成的放射性锕系金属，主要用于核燃料生产及科学研究。
item.mindustry_newhorizon-nickel-ingot.description=镍锭，由镍粉在工业高炉中冶炼而成。镍是一种重要的工业金属，主要用于制造不锈钢、镍铬合金及电池。
item.mindustry_newhorizon-niobium-ingot.description=铌锭，由铌粉在工业高炉中冶炼后经真空冷冻机冷却制得。铌是一种难熔金属，主要用于制造高温合金、超导材料及钢铁添加剂。
item.mindustry_newhorizon-nobelium-ingot.description=锘锭，由锘粉在工业高炉中冶炼后经真空冷冻机冷却制得。锘是一种人工合成的放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-osmium-ingot.description=锇锭，由锇粉在工业高炉中冶炼后经真空冷冻机冷却制得。锇是自然界中密度最大的金属，主要用于制造铱锇合金及催化剂。
item.mindustry_newhorizon-palladium-ingot.description=钯锭，由钯粉在工业高炉中冶炼后经真空冷冻机冷却制得。钯是一种铂族金属，主要用于制造催化剂、电子元件及储氢材料。
item.mindustry_newhorizon-polonium-ingot.description=钋锭，由钋粉在工业高炉中冶炼后经真空冷冻机冷却制得。钋是一种极稀有的放射性金属，可用作航天器的热源。
item.mindustry_newhorizon-platinum-ingot.description=铂锭，由铂粉在工业高炉中冶炼后经真空冷冻机冷却制得。铂是一种贵金属，主要用于制造催化剂、电极及高温坩埚。
item.mindustry_newhorizon-plutonium-ingot.description=钚锭，由钚粉在工业高炉中冶炼后经真空冷冻机冷却制得。钚是一种人工合成的放射性锕系金属，主要用于核燃料及核武器。
item.mindustry_newhorizon-potassium-ingot.description=钾锭，由钾粉在工业高炉中冶炼而成。钾是一种活泼的碱金属，主要用于制造钾盐肥料及钠钾合金（NaK）。
item.mindustry_newhorizon-praseodymium-ingot.description=镨锭，由镨粉在工业高炉中冶炼而成。镨是一种稀土金属，主要用于制造永磁材料、激光器及玻璃着色剂。
item.mindustry_newhorizon-promethium-ingot.description=钷锭，由钷粉在工业高炉中冶炼后经真空冷冻机冷却制得。钷是一种人工合成的放射性稀土金属，主要用于制造核电池及荧光材料。
item.mindustry_newhorizon-protactinium-ingot.description=镤锭，由镤粉在工业高炉中冶炼后经真空冷冻机冷却制得。镤是一种放射性锕系金属，主要用于科学研究。
item.mindustry_newhorizon-radium-ingot.description=镭锭，由镭粉在工业高炉中冶炼后经真空冷冻机冷却制得。镭是一种放射性碱土金属，曾用于制造发光涂料及医疗放射源。
item.mindustry_newhorizon-rhodium-ingot.description=铑锭，由铑粉在工业高炉中冶炼后经真空冷冻机冷却制得。铑是一种铂族金属，主要用于制造汽车尾气催化剂及镀铑钯材料。
item.mindustry_newhorizon-roentgenium-ingot.description=𬬭锭，由𬬭粉在工业高炉中冶炼后经真空冷冻机冷却制得。𬬭是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-rubidium-ingot.description=铷锭，由铷粉在工业高炉中冶炼而成。铷是一种活泼的碱金属，主要用于制造铷原子钟及光电管。
item.mindustry_newhorizon-ruthenium-ingot.description=钌锭，由钌粉在工业高炉中冶炼后经真空冷冻机冷却制得。钌是一种铂族金属，主要用于制造催化剂、电极及钌钨钼合金。
item.mindustry_newhorizon-rutherfordium-ingot.description=𬬻锭，由𬬻粉在工业高炉中冶炼后经真空冷冻机冷却制得。𬬻是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-samarium-ingot.description=钐锭，由钐粉在工业高炉中冶炼而成。钐是一种稀土金属，主要用于制造钐钴磁铁及核反应堆控制材料。
item.mindustry_newhorizon-scandium-ingot.description=钪锭，由钪粉在工业高炉中冶炼后经真空冷冻机冷却制得。钪是一种轻稀土金属，主要用于制造铝合金（如铝钪合金）及高强度材料。
item.mindustry_newhorizon-seaborgium-ingot.description=𬭳锭，由𬭳粉在工业高炉中冶炼后经真空冷冻机冷却制得。𬭳是一种人工合成的超重元素，主要用于科学研究。
item.mindustry_newhorizon-silver-ingot.description=银锭，由银粉在熔炉中烧炼而成。银是一种贵金属，具有最高的导电性和导热性，主要用于制造电子元件、焊料及合金。
item.mindustry_newhorizon-sodium-ingot.description=钠锭，由钠粉在工业高炉中冶炼而成。钠是一种活泼的碱金属，主要用于制造钠钾合金（NaK）及钠灯。
item.mindustry_newhorizon-strontium-ingot.description=锶锭，由锶粉在工业高炉中冶炼而成。锶是一种碱土金属，主要用于制造锶铁氧体磁铁及烟火材料。
item.mindustry_newhorizon-tantalum-ingot.description=钽锭，由钽粉在工业高炉中冶炼后经真空冷冻机冷却制得。钽是一种难熔金属，具有极好的抗腐蚀性，主要用于制造电容器及高温合金。
item.mindustry_newhorizon-technetium-ingot.description=锝锭，由锝粉在工业高炉中冶炼后经真空冷冻机冷却制得。锝是最轻的人工合成元素，主要用于医疗放射性示踪剂及防腐剂。
item.mindustry_newhorizon-terbium-ingot.description=铽锭，由铽粉在工业高炉中冶炼而成。铽是一种稀土金属，主要用于制造磁光材料、荧光粉及磁致伸缩合金（Terfenol-D）。
item.mindustry_newhorizon-thorium-ingot.description=钍锭，由钍粉在工业高炉中冶炼后经真空冷冻机冷却制得。钍是一种放射性锕系金属，可用作核燃料（钍-铀循环）及高温材料。
item.mindustry_newhorizon-thallium-ingot.description=铊锭，由铊粉在工业高炉中冶炼而成。铊是一种有毒金属，主要用于制造光电管、红外探测器及低熔点合金。
item.mindustry_newhorizon-thulium-ingot.description=铥锭，由铥粉在工业高炉中冶炼而成。铥是一种稀土金属，主要用于制造便携式X射线源及激光材料。
item.mindustry_newhorizon-tin-ingot.description=锡锭，由锡粉在熔炉中烧炼而成。锡是一种低熔点金属，在合金炉中与铜锭以1:3的比例混合冶炼可制成青铜锭（SnCu₃）。
item.mindustry_newhorizon-titanium-ingot.description=钛锭，由钛粉在工业高炉中冶炼后经真空冷冻机冷却制得。钛是一种轻质高强度金属，在合金炉中可与铁等元素混合制造各类钛合金。
item.mindustry_newhorizon-tungsten-ingot.description=钨锭，由钨粉在高炉中烧制得到热钨锭，冷却后得到钨锭。可用来制作钨钢，进而制作高速钢、高炉线圈、IV机器等。
item.mindustry_newhorizon-uranium-ingot.description=铀锭，由铀粉在工业高炉中冶炼后经真空冷冻机冷却制得。铀是一种放射性锕系金属，主要用于核燃料及核武器。
item.mindustry_newhorizon-vanadium-ingot.description=钒锭，由钒粉在工业高炉中冶炼后生成的热钒锭在真空冷冻机中冷却后制得，需要的最低冶炼温度为2,183 K，对应可使用坎塔尔合金线圈方块或能够承受更高炉温的线圈方块来冶炼。由钒锭和镓锭在工业高炉中混合冶炼可制成热钒镓合金锭（V₃Ga）。
item.mindustry_newhorizon-ytterbium-ingot.description=镱锭，由镱粉在工业高炉中冶炼而成。镱是一种稀土金属，主要用于制造光纤激光器及原子钟。
item.mindustry_newhorizon-yttrium-ingot.description=钇锭，由钇粉在工业高炉中冶炼而成。钇是一种稀土金属，主要用于制造钇铝石榴石（YAG）激光晶体及超导材料。
item.mindustry_newhorizon-zinc-ingot.description=锌锭，由锌粉在熔炉中烧炼而成。锌是一种重要的工业金属，在合金炉中与铜锭以1:3的比例混合冶炼可制成黄铜锭（ZnCu₃）。
item.mindustry_newhorizon-zirconium-ingot.description=锆锭，由锆粉在工业高炉中冶炼后经真空冷冻机冷却制得。锆具有良好的抗腐蚀性和低中子吸收截面，主要用于核燃料包壳及化工设备。
item.mindustry_newhorizon-annealed-copper-ingot.description=退火铜锭，由铜锭在工业高炉中与氧冶炼形成。需要的最低冶炼温度为1,200 K。退火铜具有更好的延展性和导电性，可用于制造更高电压等级的导线。
item.mindustry_newhorizon-battery-alloy-ingot.description=电池合金锭，一种用于制造高性能电池电极的专用合金材料。具有良好的导电性和抗腐蚀性。
item.mindustry_newhorizon-brass-ingot.description=黄铜锭，由铜锭和锌锭（或锌粉）以3:1的比例在合金炉中混合冶炼制成（ZnCu₃）。黄铜具有良好的加工性能和抗腐蚀性，广泛用于制造管道、配件及装饰品。
item.mindustry_newhorizon-bronze-ingot.description=青铜锭，由铜锭和锡锭（或锡粉）以3:1的比例在合金炉中混合冶炼制成（SnCu₃）。青铜是最早的合金之一，具有优异的耐磨性和抗腐蚀性。
item.mindustry_newhorizon-cupronickel-ingot.description=白铜锭，由铜锭和等量的镍锭（或镍粉）在合金炉中混合冶炼制成（CuNi）。白铜具有良好的抗腐蚀性，主要用于制造航海设备及热交换器。
item.mindustry_newhorizon-electrum-ingot.description=琥珀金锭，一种天然存在的金银合金，也可通过人工冶炼得到。具有良好的延展性和抗腐蚀性，主要用于制造装饰品及古代货币。
item.mindustry_newhorizon-invar-ingot.description=殷钢锭，一种铁镍合金，以其极低的热膨胀系数而闻名。主要用于制造精密仪器、钟表及航天结构件。
item.mindustry_newhorizon-kanthal-ingot.description=坎塔尔合金锭，化学式FeAlCr。在高炉烧制坎塔尔合金粉后冷冻获得。主要用于工业高炉的2,700K线圈材料，也可制作高耗能电线及工具。
item.mindustry_newhorizon-magnesium-aluminum-alloy-ingot.description=镁铝合金锭，由铝粉和镁粉（或铝锭和镁锭）以2:1的比例在合金炉中混合冶炼制成（MgAl₂）。镁铝合金具有轻质高强的特点，广泛用于航空航天及汽车工业。
item.mindustry_newhorizon-nichrome-ingot.description=镍铬合金锭，材料成分Ni₄Cr。由镍锭和铬锭在工业高炉中以4:1的比例混合冶炼而成，需要的最低炉温为2,700 K。可用于制造镍铬合金线圈方块，承受最高3,600K的基础炉温。
item.mindustry_newhorizon-niobium-titanium-alloy-ingot.description=铌钛合金锭，由铌和钛在工业高炉中混合冶炼而成。NbTi是最常用的低温超导材料之一，广泛用于制造超导磁体及MRI设备。
item.mindustry_newhorizon-crude-platinum-ingot.description=粗铂锭，由粗铂粉在工业高炉中冶炼后经真空冷冻机冷却制得。粗铂含有一定量的杂质，需要进一步精炼才能获得纯铂。
item.mindustry_newhorizon-sterling-silver-ingot.description=标准纯银锭，一种含银92.5%的银铜合金。具有良好的延展性和抗腐蚀性，主要用于制造银器、珠宝及货币。
item.mindustry_newhorizon-rose-gold-ingot.description=玫瑰金锭，一种金铜合金，因含有铜而呈现独特的玫瑰红色。主要用于制造珠宝及装饰品。
item.mindustry_newhorizon-black-bronze-ingot.description=黑青铜锭，一种经过特殊氧化处理的青铜合金，表面呈现黑色。主要用于制造装饰品及艺术品。
item.mindustry_newhorizon-bismuth-bronze-ingot.description=铋青铜锭，一种含铋的青铜合金。铋的加入改善了合金的切削性能，主要用于制造精密零件。
item.mindustry_newhorizon-ruthenium-tungsten-molybdenum-alloy-ingot.description=钌钨钼合金锭，由钌、钨和钼在工业高炉中混合冶炼而成。这是一种高性能难熔合金，具有优异的高温强度和抗腐蚀性。
item.mindustry_newhorizon-ruthenium-iridium-alloy-ingot.description=钌铱合金锭，由钌和铱在工业高炉中混合冶炼而成。钌铱合金具有极高的硬度和抗腐蚀性，主要用于制造耐磨电接触材料。
item.mindustry_newhorizon-solder-ingot.description=焊锡锭，一种低熔点合金，通常由锡和铅组成。广泛用于电子元件的焊接及管道连接。
item.mindustry_newhorizon-stainless-steel-ingot.description=不锈钢锭，一种含铬量至少10.5%的铁基合金。具有良好的抗腐蚀性和机械性能，广泛用于制造厨具、化工设备及建筑材料。
item.mindustry_newhorizon-steel-ingot.description=钢锭，由铁和碳在工业高炉中冶炼而成。钢是最重要的工程材料之一，广泛用于制造工具、机器结构件及建筑材料。
item.mindustry_newhorizon-tin-iron-alloy-ingot.description=锡铁合金锭，由锡和铁在工业高炉中混合冶炼而成。这种合金具有良好的抗腐蚀性，主要用于制造镀锡铁皮（马口铁）。
item.mindustry_newhorizon-hastelloy-ingot.description=哈氏合金锭，一种镍基耐腐蚀合金。具有优异的抗腐蚀性能，特别适用于强酸、强碱等恶劣化学环境，广泛用于化工设备及海洋工程。
item.mindustry_newhorizon-vanadium-gallium-alloy-ingot.description=钒镓合金锭，由钒锭和镓锭在工业高炉中混合冶炼制成热钒镓合金锭（V₃Ga），在真空冷冻机中冷却后即可得到。V₃Ga是一种重要的A15型超导材料。
item.mindustry_newhorizon-wrought-iron-ingot.description=锻铁锭，一种含碳量极低的铁合金。具有良好的延展性和焊接性能，广泛用于制造铁艺装饰品及历史建筑构件。
item.mindustry_newhorizon-iridium-osmium-alloy-ingot.description=铱锇合金锭，材料成分Ir₃Os。由铱锭和锇锭以3:1的比例在电力高炉中混合冶炼而成，需要的最低炉温为2,900K。由等量的铱锇合金锭和硅岩锭可进一步制成硅岩合金锭。
item.mindustry_newhorizon-sodium-potassium-alloy-ingot.description=钠钾合金锭，由钠和钾以一定比例混合而成（NaK）。钠钾合金在常温下为液态，具有良好的导热性，广泛用于核反应堆冷却剂。
item.mindustry_newhorizon-magnetized-iron-ingot.description=磁化铁锭，经过特殊磁化处理的铁锭。具有永磁性，可用于制造电磁铁及磁性元件。
item.mindustry_newhorizon-magnetized-neodymium-ingot.description=磁化钕锭，经过特殊磁化处理的钕锭。具有极强的永磁性，是制造钕磁铁（Nd₂Fe₁₄B）的核心材料。
item.mindustry_newhorizon-magnetized-samarium-ingot.description=磁化钐锭，经过特殊磁化处理的钐锭。具有优异的永磁性能，主要用于制造钐钴（SmCo₅）高温磁铁。
item.mindustry_newhorizon-indium-tin-barium-titanium-copper-oxide-alloy-ingot.description=铟锡钡钛铜氧合金锭，一种复杂氧化物超导材料。属于高温超导体系，可用于制造超导电缆及量子器件。
item.mindustry_newhorizon-uranium-rhodium-naquadah-alloy-ingot.description=铀铑硅岩合金锭，由铀、铑和硅岩在工业高炉中混合冶炼而成。这是一种高度先进的合金材料，具有极高的能量密度。
item.mindustry_newhorizon-enriched-naquadah-kaijin-europium-kenguranium-alloy-ingot.description=富集硅岩凯金铕铿铀合金锭，一种极其稀有的高级合金，由富集硅岩、凯金、铕、铿铀等多种稀有材料在工业高炉中混合冶炼而成。具有极高的科技等级和能量输出能力。
item.mindustry_newhorizon-inert-metal-mixture-ingot.description=惰性金属混合物锭，由多种惰性金属混合而成。化学性质极为稳定，主要用于制造耐腐蚀容器及特殊合金。
item.mindustry_newhorizon-metal-mixture-ingot.description=金属混合物锭，由多种基础金属混合而成。一种通用的工业原材料，可用于制造各类合金及机械零件。
item.mindustry_newhorizon-black-steel-ingot.description=黑钢锭，一种经过特殊表面处理或含有特定合金元素的钢材。具有高强度和高耐磨性，主要用于制造工具及机械零件。
item.mindustry_newhorizon-damascus-steel-ingot.description=大马士革钢锭，一种以层叠锻造工艺著称的优质钢材。具有独特的波浪纹理和高强度，主要用于制造高端刀具及工艺品。
item.mindustry_newhorizon-tungsten-steel-ingot.description=钨钢锭，由钨和钢在工业高炉中混合冶炼而成。钨钢具有极高的硬度和耐磨性，广泛用于制造切削工具及模具。
item.mindustry_newhorizon-cobalt-brass-ingot.description=钴黄铜锭，一种含钴的黄铜合金。钴的加入显著提高了合金的强度和抗腐蚀性。
item.mindustry_newhorizon-magnetized-steel-ingot.description=磁化钢锭，经过特殊磁化处理的钢材。具有永磁性，是制造电磁铁及磁性元件的基础材料。
item.mindustry_newhorizon-vanadium-steel-ingot.description=钒钢锭，一种添加了钒的合金钢。钒的加入显著细化了晶粒，提高了钢的强度、韧性和耐磨性。
item.mindustry_newhorizon-crude-bronze-alloy-ingot.description=粗青铜合金锭，由粗铜和粗锡在熔炉中混合冶炼而成。含有一定量的杂质，需要进一步精炼才能获得纯青铜。
item.mindustry_newhorizon-naquadah-alloy-ingot.description=硅岩合金锭，由等量的硅岩锭和铱锇合金锭在工业高炉中配合氩冶炼，需要的最低冶炼温度为7,200K。用于制造UV级别机械使用的电缆以及最高温度的线圈块（9,001K）。
item.mindustry_newhorizon-crude-palladium-ingot.description=粗钯锭，由粗钯粉在工业高炉中冶炼后经真空冷冻机冷却制得。粗钯含有一定量的杂质，需要进一步精炼才能获得纯钯。
item.mindustry_newhorizon-rare-metal-mixture-ingot.description=稀有金属混合物锭，由多种稀有金属混合而成。含有铟、镓、锗等稀有元素，是制造高级合金及半导体材料的重要原料。
item.mindustry_newhorizon-rhodium-plated-palladium-ingot.description=镀铑钯锭，表面镀有铑层的钯锭。铑镀层提供了优异的抗腐蚀性和反射性能，主要用于制造电子元件及精密仪器。
item.mindustry_newhorizon-red-steel-ingot.description=红钢锭，一种含铬量较高的合金钢，因表面呈红色而得名。具有优异的高温强度和抗腐蚀性。
item.mindustry_newhorizon-blue-steel-ingot.description=蓝钢锭，一种经过特殊热处理或含特定合金元素的钢材，因表面呈蓝色而得名。具有高硬度和高耐磨性。
item.mindustry_newhorizon-high-speed-steel-g-ingot.description=高速钢-G锭，一种含钨、钼、铬、钒等合金元素的高性能工具钢。具有优异的热硬性和耐磨性，广泛用于制造高速切削工具。
item.mindustry_newhorizon-red-alloy-ingot.description=红色合金锭，由红石（红石粉）和铜锭以1:2的比例在工业高炉中（或1:4在合金炉中）混合冶炼制成。主要用于制造红石合金电路及元件。
item.mindustry_newhorizon-high-speed-steel-e-ingot.description=高速钢-E锭，一种含钴的高性能高速钢。钴的加入显著提高了钢材的高温硬度和红硬性，适用于重切削加工。
item.mindustry_newhorizon-high-speed-steel-s-ingot.description=高速钢-S锭，一种含钒量较高的高速钢。钒的加入细化了碳化物颗粒，提高了钢材的耐磨性和韧性。
item.mindustry_newhorizon-iridium-slag-ingot.description=铱金属渣锭，在铱金属冶炼过程中产生的副产物。含有少量铱及其他贵金属，可回收提取有用金属。
item.mindustry_newhorizon-blue-alloy-ingot.description=蓝色合金锭，一种含钴、铬等元素的耐热合金，因表面呈蓝色而得名。具有优异的高温强度和抗腐蚀性。
item.mindustry_newhorizon-hsla-steel-ingot.description=HSLA钢锭（高强度低合金钢锭），一种添加了微量合金元素（如铌、钒、钛）的低碳钢。具有高强度、高韧性和良好的焊接性能。
item.mindustry_newhorizon-waterproof-steel-ingot.description=防水钢锭，一种经过特殊处理的钢材。具有优异的抗水渗透和抗腐蚀性能，主要用于制造水下设备及海洋工程结构。
item.mindustry_newhorizon-heat-resistant-chromium-iron-alloy-ma-956-ingot.description=耐热铬铁合金MA 956锭，一种氧化物弥散强化（ODS）铁铬铝合金。具有优异的高温强度和抗氧化性能，工作温度可达1,200°C以上。
item.mindustry_newhorizon-maraging-steel-300-ingot.description=马氏体时效钢300锭，一种含镍、钴、钼的高性能钢材。通过时效热处理可获得极高的强度和韧性，广泛用于航空航天及模具制造。
item.mindustry_newhorizon-hastelloy-x-ingot.description=哈斯特洛依合金X锭，一种镍基高温合金。具有优异的高温强度、抗氧化性和抗碳化性能，广泛用于燃气轮机及化工高温设备。
item.mindustry_newhorizon-stellite-100-ingot.description=司太立100锭，一种钴基耐磨合金。具有极高的硬度和抗磨损性能，广泛用于制造阀门、轴承及切削工具。
item.mindustry_newhorizon-hastelloy-c-276-ingot.description=哈斯特洛依合金C-276锭，一种镍钼铬系耐腐蚀合金。具有优异的抗均匀腐蚀和局部腐蚀性能，特别适用于强氧化性和还原性酸环境。


